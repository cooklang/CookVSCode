name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run compile
      - name: Bundle
        run: npm run esbuild
      # The extension has no automated tests yet (only sample .cook fixtures).
      - name: Package (vsce)
        run: npx vsce package
